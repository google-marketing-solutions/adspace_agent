repos:
  # pylint/ruff sync
  - repo: https://github.com/cidrblock/pylint-ruff-sync
    rev: v25.07.18.000003
    hooks:
      - id: pylint-ruff-sync
        args: ["--disable-pylint-cleaner"]

  # uv
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.18
    hooks:
      - id: uv-lock

  # Google
  - repo: https://github.com/google/pre-commit-tool-hooks
    rev: v1.2.5
    hooks:
      - id: check-copyright
        args:
          - --custom_format
          - '\.py$'
          - ""
          - "# "
          - ""
          - --custom_format
          - '\.sql$'
          - ""
          - "-- "
          - ""
          - --skip_pattern
          - .*\.md|.*\.config\.js|\.pylintrc|LICENSE|.*\.toml|\.gitignore|\.git|requirements\.txt|google-ads.yaml|uv.lock|.python-version
      - id: check-google-doc-style
      - id: check-links

  # Miscellaneous
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  # Python
  - repo: https://github.com/pylint-dev/pylint
    rev: v4.0.4
    hooks:
      - id: pylint
  - repo: https://github.com/DetachHead/basedpyright-pre-commit-mirror
    rev: 1.36.1
    hooks:
      - id: basedpyright
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.9
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty-check
        name: ty check
        entry: uv run --active ty check
        language: python
        pass_filenames: false
  - repo: local
    hooks:
      - id: python-testing
        name: pytest
        entry: uv run --active pytest --cov --cov-fail-under=80
        language: python
        pass_filenames: false
        always_run: true

  # Markdown
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          # - mdformat-config
          # - mdformat-footnote
          # - mdformat-frontmatter
          - mdformat-gfm
          - mdformat-gfm-alerts
          - mdformat-ruff
          - mdformat-shfmt

  # Conventional Commits
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.10.1
    hooks:
      - id: commitizen

  # SQL
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.0.0a2
    hooks:
      - id: sqlfluff-lint
        additional_dependencies:
          - dbt-bigquery
      - id: sqlfluff-fix
        additional_dependencies:
          - dbt-bigquery
