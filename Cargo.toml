[package]
name = "adspace-agent"
version = "0.13.0"
edition = "2024"
rust-version = "1.99"
description = "AdSpace Agent is designed to provide a standardized way to integrate an LLM with Google Ads, YouTube, Google Cloud, and Google Search to form a more comprehensive campaign and marketing plan for agencies."
readme = "README.md"
license = "Apache-2.0"
publish = false

# `package.authors` is deprecated; Cargo ignores this table, so no warning.
[package.metadata]
authors = ["Tony Coconate <coconate@google.com>", "Brian Craft <bcraft@google.com>"]

[lib]
name = "adspace_agent"
path = "src/lib.rs"

[[bin]]
name = "adspace-agent"
path = "src/main.rs"

[dependencies]
# Direct dep for `launcher::{Launcher, TelemetryConfig}` while keeping `adk-rust` free of its `cli` default features.
adk-cli = { git = "https://github.com/zavora-ai/adk-rust", rev = "3d346d49b5af66bc69ff59a7de9be37c20cbd25b", default-features = false }
adk-gemini = { git = "https://github.com/zavora-ai/adk-rust", rev = "3d346d49b5af66bc69ff59a7de9be37c20cbd25b", features = ["vertex"] }
adk-rust = {
  git = "https://github.com/zavora-ai/adk-rust",
  rev = "3d346d49b5af66bc69ff59a7de9be37c20cbd25b",
  default-features = false,
  features = [
    "agent-engine",
    "artifacts",
    "code-tools",
    "gcs-artifacts",
    "gemini-vertex",
    "memory",
    "memory-tools",
    "minimal",
    "server",
    "skills",
    "skills-progressive-disclosure",
    "telemetry",
    "tools",
    "vertex-sandbox",
  ]
}
adk-session = { git = "https://github.com/zavora-ai/adk-rust", rev = "3d346d49b5af66bc69ff59a7de9be37c20cbd25b", features = ["encrypted-session", "firestore", "sqlite"] }
adk-surface = { git = "https://github.com/zavora-ai/adk-rust", rev = "3d346d49b5af66bc69ff59a7de9be37c20cbd25b", default-features = false, features = ["web", "genui"] }
adk-ui = { git = "https://github.com/zavora-ai/adk-ui", rev = "efa1c7433cdce2c8ee6c81af284b9283f0663ec1" }
axum = "0.8.9"

anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", default-features = false }
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
dotenvy = "0.15.7"
futures = "0.3.34"
google-cloud-auth = { version = "1.19.0", default-features = false, features = ["default-rustls-provider"] }
hmac = "0.13.0"
indexmap = { version = "2.14.2", features = ["serde"] }
memchr = "2.8.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["deflate", "form", "gzip", "http2", "json", "query", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.6.11", default-features = false, features = ["compression-deflate", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "registry", "std"] }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[features]
default = []
# Opt-in: adk-rust's in-process Monty Python interpreter as a `PYTHON_EXECUTOR=monty`
# backend. Off by default to avoid pulling the extra Monty/Ruff crate tree unless needed.
monty = ["adk-rust/code-embedded-python"]

# `adk-ui` 3.0.0 depends on `adk-surface = "3.0.0"` from crates.io until ADK-Rust 3.0 is published.
[patch.crates-io]
adk-surface = { git = "https://github.com/zavora-ai/adk-rust", rev = "3d346d49b5af66bc69ff59a7de9be37c20cbd25b" }
