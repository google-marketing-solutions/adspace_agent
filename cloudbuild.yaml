# Builds the AdSpace Agent image with cargo-chef + BuildKit registry caching in
# Artifact Registry. Subsequent builds skip compiling unchanged crates.
#
# Usage:
#   gcloud builds submit --config cloudbuild.yaml --region us-central1
#   gcloud run deploy adspace-agent-rs \
#     --image us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/adspace-agent-rs:latest \
#     --region us-central1

substitutions:
  _REGION: us-central1
  _AR_REPO: cloud-run-source-deploy
  _SERVICE: adspace-agent-rs

options:
  machineType: E2_HIGHCPU_32
  logging: CLOUD_LOGGING_ONLY

steps:
  - name: gcr.io/cloud-builders/docker
    id: build-and-push
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE_URI="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:latest"
        CACHE_URI="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE}:buildcache"
        docker buildx create --name chef-builder --driver docker-container --use
        docker buildx build \
          --push \
          --tag "$${IMAGE_URI}" \
          --cache-from "type=registry,ref=$${CACHE_URI}" \
          --cache-to "type=registry,ref=$${CACHE_URI},mode=max" \
          .
