[project]
name = "adspace_agent"
version = "0.12.0"
description = "AdSpace Agent is designed to provide a standardized way to integrate an LLM with Google Ads, YouTube, Google Cloud, and Google Search to form a more comprehensive campaign and marketing plan for agencies."
readme = "README.md"
requires-python = ">=3.12"
license-files = ["LICENSE"]
authors = [
  { name = "Tony Coconate", email = "coconate@google.com" },
  { name = "Brian Craft", email = "bcraft@google.com" }
]
dependencies = [
  "altair",
  "bigframes",
  "calplot",
  "cvxpy",
  "db-dtypes",
  "fastapi",
  "google-adk",
  "google-ads-adk",
  "google-api-python-client",
  "google-cloud-aiplatform",
  "google-cloud-storage",
  "google-cloud-dataplex",
  "google-genai",
  "greenlet",
  "holidays",
  "langchain-experimental",
  "matplotlib",
  "numpy",
  "openpyxl",
  "pandas",
  "patchworklib",
  "pillow",
  "plotly",
  "polars",
  "prophet",
  "pyarrow",
  "pydantic",
  "python-dateutil",
  "python-dotenv",
  "python-multipart",
  "requests",
  "scikit-learn",
  "scipy",
  "seaborn",
  "statsmodels",
  "tqdm",
  "validators",
  "wordcloud",
]

[project.scripts]
deploy-agent-engine = "adspace_agent.deploy:main"
list-tools = "adspace_agent.utils.list_tools:main"

[dependency-groups]
dev = [
  "commitizen",
  "coverage",
  "prek",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
  "rumdl",
  "tombi",
  "ty"
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12"]
build-backend = "uv_build"

[tool.commitizen]
version_provider = "pep621"

[tool.ruff]
fix = true
line-length = 80
preview = true
target-version = "py312"
exclude = ["third_party"]

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
  "incorrect-blank-line-before-class",  # one-blank-line-before-class (Google style)
  "multi-line-summary-second-line",  # multi-line-summary-second-line (Google style)
  "missing-trailing-comma",  # missing-trailing-comma (formatter conflict)
  "single-line-implicit-string-concatenation",  # single-line-implicit-string-concatenation (formatter conflict)
  "print",  # print-found (fine for CLI tools)
  "multiple-statements-on-one-line-colon",  # single-line-if-stmt (Google style allows this)
  "invalid-function-name",  # function-name-lowercase (Google allows CamelCase functions)
  "invalid-argument-name",  # argument-name-lowercase (Google allows CamelCase arguments)
  "non-lowercase-variable-in-function",  # non-lowercase-variable-in-function (Google allows CamelCase variables)
  "lowercase-imported-as-non-lowercase",  # lowercase-imported-as-non-lowercase (Google naming flexibility)
  "line-contains-todo",  # line-contains-todo (Google style uses TODOs)
  "missing-todo-link",  # missing-todo-link (Google style doesn't require links)
]
logger-objects = ["logging", "absl.logging", "tensorflow.io.logging"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "assert",  # assert-used (required for pytest)
  "ANN",  # type annotations (not needed for tests)
  "undocumented-public-module",  # missing docstring in module
  "undocumented-public-function",  # missing docstring in function
]
"__init__.py" = ["undocumented-public-package"]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
known-third-party = ["enchant", "absl"]
order-by-type = false
single-line-exclusions = ["typing"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"regsub".msg = "Deprecated module, see Google Python Style Guide."
"TERMIOS".msg = "Deprecated module, see Google Python Style Guide."
"Bastion".msg = "Deprecated module, see Google Python Style Guide."
"rexec".msg = "Deprecated module, see Google Python Style Guide."
"sets".msg = "Deprecated module, see Google Python Style Guide."

[tool.rumdl]
exclude = [
  ".git",
  "node_modules",
  "vendor",
  "dist",
  "build",
  "LICENSE.md",
  "LICENSE"
]
respect-gitignore = true

[tool.rumdl.MD003]
style = "atx"

[tool.rumdl.MD004]
style = "dash"

[tool.rumdl.MD007]
indent = 4

[tool.rumdl.MD009]
strict = true

[tool.rumdl.MD013]
line-length = 80
code-blocks = false
tables = false
reflow = true

[tool.rumdl.MD026]
punctuation = ".,;:!。，；：！"

[tool.rumdl.MD029]
style = "one"

[tool.rumdl.MD040]
severity = "warning"

[tool.rumdl.MD041]
severity = "warning"

[tool.rumdl.MD046]
style = "fenced"

[tool.rumdl.MD049]
style = "underscore"

[tool.rumdl.MD050]
style = "asterisk"

[tool.tombi.lsp]
goto-type-definition.enabled = false

[tool.uv]
package = true
required-version = ">=0.8.11"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.build-backend]
module-root = ""
module-name = "adspace_agent"
source-exclude = ["assets"]

[tool.uv.sources]
google-ads-adk = { git = "https://github.com/google-marketing-solutions/google_ads_adk" }
