[project]
name = "adspace_agent"
version = "0.10.0"
description = "AdSpace Agent is designed to provide a standardized way to integrate an LLM with Google Ads, YouTube, Google Cloud, and Google Search to form a more comprehensive campaign and marketing plan for agencies."
readme = "README.md"
requires-python = ">=3.12"
license-files = ["LICENSE"]
authors = [
  { name = "Tony Coconate", email = "coconate@google.com" },
  { name = "Brian Craft", email = "bcraft@google.com" }
]
dependencies = [
  "altair",
  "bigframes",
  "calplot",
  "cvxpy",
  "db-dtypes",
  "fastapi",
  "google-adk",
  "google-ads-adk",
  "google-genai",
  "holidays",
  "langchain-experimental",
  "matplotlib",
  "numpy",
  "openpyxl",
  "pandas",
  "patchworklib",
  "pillow",
  "plotly",
  "polars",
  "prophet",
  "pyarrow",
  "pydantic",
  "python-dateutil",
  "python-dotenv",
  "requests",
  "scikit-learn",
  "scipy",
  "seaborn",
  "statsmodels",
  "tqdm",
  "validators",
  "wordcloud",
]

[project.scripts]
list-tools = "adspace_agent.utils.list_tools:main"

[dependency-groups]
dev = [
  "commitizen",
  "coverage",
  "mdformat",
  "mdformat-config",
  "mdformat-footnote",
  "mdformat-frontmatter",
  "mdformat-gfm",
  "mdformat-gfm-alerts",
  "mdformat-ruff",
  "mdformat-shfmt",
  "prek",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
  "tombi",
  "ty"
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"

[tool.mdformat]
wrap = 80
number = true
validate = true

[tool.ruff]
fix = true
line-length = 80
preview = true
target-version = "py312"
exclude = ["third_party"]

[tool.ruff.format]
preview = true
docstring-code-format = true

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
  "D203",  # one-blank-line-before-class (Google style)
  "D213",  # multi-line-summary-second-line (Google style)
  "COM812",  # missing-trailing-comma (formatter conflict)
  "ISC001",  # single-line-implicit-string-concatenation (formatter conflict)
  "T201",  # print-found (fine for CLI tools)
  "E701",  # single-line-if-stmt (Google style allows this)
  "N802",  # function-name-lowercase (Google allows CamelCase functions)
  "N803",  # argument-name-lowercase (Google allows CamelCase arguments)
  "N806",  # non-lowercase-variable-in-function (Google allows CamelCase variables)
  "N812",  # lowercase-imported-as-non-lowercase (Google naming flexibility)
  "FIX002",  # line-contains-todo (Google style uses TODOs)
  "TD003",  # missing-todo-link (Google style doesn't require links)
  "C901",
  "PLR0912",
  "E501",
  "RUF029",
  "TC002"
]
logger-objects = ["logging", "absl.logging", "tensorflow.io.logging"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "S101",  # assert-used (required for pytest)
  "ANN",  # type annotations (not needed for tests)
  "D100",  # missing docstring in module
  "D103",  # missing docstring in function
]
"__init__.py" = ["D104"]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
known-third-party = ["enchant", "absl"]
order-by-type = false
single-line-exclusions = ["typing"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"regsub".msg = "Deprecated module, see Google Python Style Guide."
"TERMIOS".msg = "Deprecated module, see Google Python Style Guide."
"Bastion".msg = "Deprecated module, see Google Python Style Guide."
"rexec".msg = "Deprecated module, see Google Python Style Guide."
"sets".msg = "Deprecated module, see Google Python Style Guide."

[tool.tombi.lsp]
goto-type-definition.enabled = false

[tool.uv]
package = true
required-version = ">=0.8.11"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.uv.build-backend]
module-root = ""
module-name = "adspace_agent"
source-exclude = ["assets"]

[tool.uv.sources]
google-ads-adk = { git = "https://github.com/google-marketing-solutions/google_ads_adk" }
